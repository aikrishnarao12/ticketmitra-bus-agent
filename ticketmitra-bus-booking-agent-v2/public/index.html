<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TicketMitra — Bus Booking (Test Demo)</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #e5ddd3; display: flex; justify-content: center;
  }
  .phone {
    width: 100%; max-width: 420px; height: 100vh; background: #f7f5f2;
    display: flex; flex-direction: column; box-shadow: 0 0 24px rgba(0,0,0,0.15);
  }
  header {
    background: #0b5e4c; color: white; padding: 14px 16px; display: flex; align-items: center; gap: 10px;
  }
  header .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: #ffb020; color: #0b5e4c;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
  }
  header .title { font-weight: 600; font-size: 15px; }
  header .subtitle { font-size: 12px; opacity: 0.85; }
  .banner {
    background: #fff3cd; color: #7a5c00; font-size: 11px; padding: 6px 12px; text-align: center;
    border-bottom: 1px solid #f0e2ac;
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .bubble { max-width: 80%; padding: 8px 12px; border-radius: 14px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
  .me { align-self: flex-end; background: #d9fdd3; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #ffffff; border-bottom-left-radius: 4px; box-shadow: 0 1px 1px rgba(0,0,0,0.06); }
  .bot.pending { color: #888; font-style: italic; }
  form#composer {
    display: flex; gap: 8px; padding: 10px; background: #f0efeb; border-top: 1px solid #ddd;
  }
  #input {
    flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #ccc; font-size: 14px; outline: none;
  }
  #send {
    background: #0b5e4c; color: white; border: none; border-radius: 20px; padding: 0 18px; font-size: 14px; cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="phone">
    <header>
      <div class="avatar">TM</div>
      <div>
        <div class="title">TicketMitra</div>
        <div class="subtitle">Bus ticket booking, by text</div>
      </div>
    </header>
    <div class="banner">TEST DEMO — mock bus network, no real tickets or payments</div>
    <div id="messages"></div>
    <form id="composer">
      <input id="input" type="text" placeholder="Text TicketMitra…" autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

<script>
  const sessionId = "web-" + Math.random().toString(36).slice(2) + Date.now();
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  function addBubble(text, who, pending) {
    const div = document.createElement("div");
    div.className = "bubble " + who + (pending ? " pending" : "");
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  addBubble("Hi! I'm TicketMitra 👋 Where would you like to travel, and when?", "bot");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addBubble(text, "me");
    input.value = "";
    sendBtn.disabled = true;
    const pendingBubble = addBubble("typing…", "bot", true);

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ sessionId, message: text }),
      });
      const data = await res.json();
      pendingBubble.remove();
      if (data.error) {
        addBubble("⚠️ " + data.error, "bot");
      } else {
        addBubble(data.reply, "bot");
      }
    } catch (err) {
      pendingBubble.remove();
      addBubble("⚠️ Network error: " + err.message, "bot");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
